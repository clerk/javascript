# Subflow: enter email + password into the native AuthView and submit.
# Requires CLERK_TEST_EMAIL and CLERK_TEST_PASSWORD env vars.
appId: com.clerk.exponativebuildfixture
---
- extendedWaitUntil:
    visible: 'Welcome! Sign in to continue\.?'
    timeout: 25000
# The AuthView sometimes renders its welcome text a beat before the email
# field; don't tap until the field is actually present. The placeholder
# varies by instance config (email-only vs email+username).
- extendedWaitUntil:
    visible: 'Enter your email( or username)?'
    timeout: 25000
# Clear any pre-populated identifier (Clerk persists the last-used one in
# secure-store, surviving clearState). On iOS eraseText is cursor-dependent,
# so Select-all via the edit menu when it shows (the menu is unreliable on a
# remounted AuthView). On Android eraseText clears the whole field, and the
# long-press can open Gboard's features panel over the screen instead of the
# edit menu, so skip the menu dance there. The retry gates on reaching the
# password step, so a mangled identifier gets a clean second attempt.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: 'Enter your email( or username)?'
      - waitForAnimationToEnd:
          timeout: 2000
      # A remounted AuthView prefills the last-used identifier, which is the
      # same email this flow signs in with, and clearing a prefilled field is
      # cursor-position dependent on Android. Only clear and retype when the
      # field does not already hold the right value.
      - runFlow:
          when:
            notVisible: ${CLERK_TEST_EMAIL}
          commands:
            - runFlow:
                when:
                  platform: iOS
                commands:
                  - longPressOn:
                      text: 'Enter your email( or username)?'
                  - runFlow:
                      when:
                        visible: 'Select All'
                      commands:
                        - tapOn:
                            text: 'Select All'
            - eraseText: 100
            - inputText: ${CLERK_TEST_EMAIL}
      # Wait for the typed value to land before tapping: the tap can race the
      # recomposition that enables the button, and this also catches a mangled
      # identifier inside the retry instead of at the next screen's timeout.
      - extendedWaitUntil:
          visible: ${CLERK_TEST_EMAIL}
          timeout: 5000
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: 'Continue'
          index: 0
      # Which first factor comes next depends on instance config AND SDK:
      # clerk-ios can go email-code-first where clerk-android goes
      # password-first. Accept either screen.
      - extendedWaitUntil:
          visible: 'Enter your password|Check your email'
          timeout: 15000
# Email-code-first: for +clerk_test@ emails the documented test code is
# 424242: https://clerk.com/docs/testing/test-emails-and-phones
- runFlow:
    when:
      visible: 'Check your email'
    commands:
      - inputText: '424242'
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: 'Enter your password'
    commands:
      - tapOn:
          text: 'Enter your password'
      - eraseText: 50
      - inputText: ${CLERK_TEST_PASSWORD}
      # The password is masked so its value can't be asserted; settle for the
      # screen going stable so the tap doesn't race the enabling recomposition.
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: 'Continue'
          index: 0
      - waitForAnimationToEnd:
          timeout: 5000
      # The screen stays stable while the sign-in request is in flight, so the
      # animation wait alone can return before the next screen exists. Wait for
      # either outcome so the conditional below sees the real screen.
      - extendedWaitUntil:
          visible: 'Check your email|signed in'
          timeout: 15000
          optional: true
# Some instances ask for the email code after the password instead.
- runFlow:
    when:
      visible: 'Check your email'
    commands:
      - inputText: '424242'
      - waitForAnimationToEnd:
          timeout: 5000
# Android Google Password Manager may prompt to save the password.
- runFlow:
    when:
      visible: '.*Google Password Manager.*'
    commands:
      - tapOn:
          text: 'Not now|Never'
      - waitForAnimationToEnd:
          timeout: 2000
# iOS system Save Password / iCloud Keychain prompt overlays the app.
- runFlow:
    when:
      visible: 'Save Password|Strong Password|Use Strong Password|AutoFill Passwords'
    commands:
      - tapOn:
          text: 'Not Now|Never for This Website|Don.t Save'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
