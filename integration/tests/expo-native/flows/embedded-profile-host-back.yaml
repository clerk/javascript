# Embedded UserProfileView (onHostBack): internal navigation stays native,
# and the host-supplied root back button closes the screen from JS.
appId: com.clerk.exponativebuildfixture
name: Embedded UserProfileView host back round trip
---
- runFlow: subflows/open-app.yaml
- tapOn:
    id: 'open-auth-view-button'
- runFlow: subflows/sign-in-email-password.yaml
- runFlow: subflows/assert-signed-in.yaml
- tapOn:
    id: 'open-embedded-profile-button'
# The internal push differs per platform: clerk-ios pushes a Security screen
# from the profile root, clerk-android uses tabs at the root and pushes the
# Manage account screen instead. The double-Back contract below is the same:
# both back buttons read 'Back' but only one exists at a time, so the first
# tap pops Clerk's internal stack and the second is the host chevron firing
# onHostBack.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Security'
          timeout: 20000
      - tapOn:
          text: 'Security'
      - extendedWaitUntil:
          visible: 'Password|Passkeys|Two-step verification|Active devices'
          timeout: 15000
      - tapOn: 'Back'
      - extendedWaitUntil:
          visible: 'Security'
          timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: 'Edit profile'
          timeout: 20000
      - tapOn:
          text: 'Manage account'
      - extendedWaitUntil:
          visible: 'EMAIL ADDRESSES|Add email address'
          timeout: 15000
      - tapOn: 'Back'
      - extendedWaitUntil:
          visible: 'Edit profile'
          timeout: 15000
- tapOn: 'Back'
- extendedWaitUntil:
    visible:
      id: 'open-embedded-profile-button'
    timeout: 15000
- tapOn:
    id: 'sign-out-button'
- runFlow: subflows/assert-signed-out.yaml
