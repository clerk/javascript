# A custom page's React Native content is mounted as a child of the native host
# and rehosted into the destination its row pushes, then survives the trip back.
appId: com.clerk.exponativebuildfixture
name: UserProfileView renders a custom page
---
- runFlow: subflows/open-app.yaml
- tapOn:
    id: 'open-auth-view-button'
- runFlow: subflows/sign-in-email-password.yaml
- runFlow: subflows/assert-signed-in.yaml
- tapOn:
    id: 'open-embedded-profile-button'
# Retrying wait: the row list lands a frame after the native profile paints.
- extendedWaitUntil:
    visible: 'E2E Custom Page'
    timeout: 20000
- tapOn:
    text: 'E2E Custom Page'
- extendedWaitUntil:
    visible: 'Rehosted RN body'
    timeout: 15000
# The Android destination is a bare AndroidView with no back chrome, unlike the
# iOS page which clerk-ios pushes onto its own NavigationStack.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Back'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: 'E2E Custom Page'
    timeout: 15000
# The host chevron firing onHostBack, which reads 'Back' on both platforms.
- tapOn: 'Back'
- extendedWaitUntil:
    visible:
      id: 'open-embedded-profile-button'
    timeout: 15000
- tapOn:
    id: 'sign-out-button'
- runFlow: subflows/assert-signed-out.yaml
