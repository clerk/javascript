# Subflow: enter email + password into the native AuthView and submit.
# Credentials come from Argent secrets: export ARGENT_SECRET_CLERK_TEST_EMAIL
# and ARGENT_SECRET_CLERK_TEST_PASSWORD before the run. Resolved values are
# redacted from reports automatically.
executionPrerequisite: Native AuthView is open on the sign-in start screen
steps:
  - await: { visible: { text: { matches: 'Welcome! Sign in to continue' } }, timeout: 25000 }
  # The AuthView sometimes renders its welcome text a beat before the email
  # field; don't type until the field is actually present. The placeholder
  # varies by instance config (email-only vs email+username).
  - await: { visible: { text: { matches: 'Enter your email( or username)?' } }, timeout: 25000 }
  # A remounted AuthView (second sign-in in the same process) prefills the
  # last-used identifier, which is the same email this flow signs in with.
  # The placeholder is only visible while the field is empty, so gate the
  # typing on it instead of clearing a prefilled field.
  - when: { visible: { text: { matches: 'Enter your email( or username)?' } } }
    steps:
      - tap: { text: { matches: 'Enter your email( or username)?' } }
      - type: { into: { text: { matches: 'Enter your email( or username)?' } }, text: '{{secret:CLERK_TEST_EMAIL}}', submit: false }
  # Let the enabling recomposition settle so the tap doesn't race it.
  - await: { idle: true }
  - tap: { text: Continue }
  # Which first factor comes next depends on instance config AND SDK:
  # clerk-ios can go email-code-first where clerk-android goes
  # password-first. Accept either screen.
  - await: { visible: { text: { matches: 'Enter your password|Check your email' } }, timeout: 15000 }
  # Email-code-first: for +clerk_test@ emails the documented test code is
  # 424242: https://clerk.com/docs/testing/test-emails-and-phones
  - when: { visible: { text: Check your email } }
    steps:
      - type: { into: { role: TextField }, text: '424242', submit: false }
      - await: { idle: true, timeout: 9000 }
  - when: { visible: { text: Enter your password } }
    steps:
      - tap: { text: Enter your password }
      - type: { into: { text: Enter your password }, text: '{{secret:CLERK_TEST_PASSWORD}}', submit: false }
      - await: { idle: true }
      - tap: { text: Continue }
      - await: { idle: true, timeout: 9000 }
  # Some instances ask for the email code after the password instead.
  - when: { visible: { text: Check your email } }
    steps:
      - type: { into: { role: TextField }, text: '424242', submit: false }
      - await: { idle: true, timeout: 9000 }
  # Password-manager prompts. System overlays may not appear in the flow
  # runner's app-scoped tree; these blocks are no-ops when unmatched.
  - when: { visible: { text: Google Password Manager } }
    steps:
      - tap: { text: { matches: 'Not now|Never' } }
  - when: { visible: { text: { matches: 'Save Password|Strong Password|AutoFill Passwords' } } }
    steps:
      - tap: { text: { matches: "Not Now|Never for This Website|Don't Save" } }
