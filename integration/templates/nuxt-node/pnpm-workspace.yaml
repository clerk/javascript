packages:
  - '.'

# Vite 8.4.0 (2026-11-26) moved to rolldown 1.3 and Nuxt 4.5.1's build fails under it with
# EXTERNAL_MODULES_CANNOT_BE_TRANSFORMED_TO_MODULES on unctx. The temp app installs fresh, so
# its transitive vite floated onto it. The harness installs the app with npm through pkglab,
# which reads the top-level "overrides" in package.json; this file covers a pnpm install.
# Drop both pins once Nuxt or Vite ships a fix.
overrides:
  vite: 8.3.8
