name: Expo E2E flaky tests

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    name: Post the flaky tests to Slack
    if: github.repository == 'clerk/javascript'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify-flaky.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.15.0

      - name: Post the flaky tests of the last 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh run list --workflow verify-e2e.yml --branch changeset-release/main --event pull_request --created ">=$since" --limit 200 --json databaseId,conclusion > "$RUNNER_TEMP/runs.json"
          mapfile -t ids < <(jq -r '.[] | select(.conclusion != "" and .conclusion != "cancelled" and .conclusion != "skipped") | .databaseId' "$RUNNER_TEMP/runs.json")
          mkdir -p "$RUNNER_TEMP/flaky"
          for id in "${ids[@]}"; do
            gh run download "$id" --pattern 'verify-flaky-*' --dir "$RUNNER_TEMP/flaky/$id" || echo "Run $id kept no flaky tests."
          done
          MESSAGE="$(node scripts/verify-flaky.mjs digest "$RUNNER_TEMP/flaky" --runs "${#ids[@]}" --hours 24)"
          if [ -z "$MESSAGE" ]; then
            echo "No flaky tests in the last 24 hours."
            exit 0
          fi
          echo "$MESSAGE"
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL is not configured; skipping Slack notification"
            exit 0
          fi
          PAYLOAD="$(jq -n --arg text "$MESSAGE" '{text: $text, unfurl_links: false, unfurl_media: false}')"
          curl --fail-with-body --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-max-time 60 --retry-all-errors \
            --request POST --header "Content-type: application/json" --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
