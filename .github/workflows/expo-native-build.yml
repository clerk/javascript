name: 'Expo native (@clerk/expo)'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - '.github/workflows/expo-native-build.yml'
      - 'integration/templates/expo-native/**'
      - 'integration/tests/expo-native/**'
      - 'packages/expo/**'
      - 'packages/expo-google-signin/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-native-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FIXTURE_DIR: integration/templates/expo-native
  E2E_DIR: integration/tests/expo-native
  FIXTURE_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
  SDK_PACK_DIR: /tmp/clerk-expo-pack
  E2E_INSTANCE_NAME: clerkstage-with-native-components
  BAPI_URL: https://api.clerkstage.dev
  ARGENT_VERSION: '0.20.0'

jobs:
  native-build:
    if: ${{ github.head_ref != 'changeset-release/main' }}
    name: Expo ${{ matrix.expo-sdk }} ${{ matrix.run-e2e == true && 'Build + E2E' || 'Build' }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.run-e2e == true && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - expo-sdk: 54
            platform: android
            runner: blacksmith-8vcpu-ubuntu-2204
          - expo-sdk: 54
            platform: ios
            runner: blacksmith-6vcpu-macos-26
          - expo-sdk: 55
            platform: android
            runner: blacksmith-8vcpu-ubuntu-2204
          - expo-sdk: 55
            platform: ios
            runner: blacksmith-6vcpu-macos-26
          - expo-sdk: 57
            platform: android
            # 24.04: argent's linux simulator-server needs glibc >= 2.39.
            runner: blacksmith-8vcpu-ubuntu-2404
            run-e2e: true
          - expo-sdk: 57
            platform: ios
            runner: blacksmith-6vcpu-macos-26
            run-e2e: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Compute native build cache key
        id: native-build-key
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          build_hash="$(
            git ls-files -s -- \
              .npmrc \
              package.json \
              pnpm-lock.yaml \
              pnpm-workspace.yaml \
              tsconfig.json \
              turbo.json \
              packages/clerk-js \
              packages/expo \
              packages/expo-google-signin \
              packages/react \
              packages/shared \
              "$FIXTURE_DIR" |
              git hash-object --stdin
          )"
          if [ "$PLATFORM" = "android" ]; then
            artifact="$FIXTURE_DIR/android/app/build/outputs/apk/release/app-release.apk"
          else
            artifact="$FIXTURE_DIR/ios/build/Build/Products/Release-iphonesimulator/ClerkExpoNativeBuildFixture.app"
          fi
          echo "hash=$build_hash" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Restore native build
        id: native-build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.native-build-key.outputs.artifact }}
          # Bump the version when native build commands change.
          key: expo-native-build-v1-${{ runner.os }}-${{ matrix.expo-sdk }}-${{ matrix.platform }}-${{ matrix.run-e2e == true && 'e2e' || 'build' }}-${{ env.E2E_INSTANCE_NAME }}-${{ steps.native-build-key.outputs.hash }}

      - if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install monorepo dependencies
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and pack Clerk packages
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @clerk/expo... build
          mkdir -p "$SDK_PACK_DIR"
          pnpm --filter @clerk/expo pack --pack-destination "$SDK_PACK_DIR"
          pnpm --filter @clerk/expo-google-signin pack --pack-destination "$SDK_PACK_DIR"

      - name: Install fixture dependencies
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.FIXTURE_DIR }}
        env:
          EXPO_SDK: ${{ matrix.expo-sdk }}
          RUN_E2E: ${{ matrix.run-e2e == true && 'true' || 'false' }}
        run: |
          cp "package.sdk-$EXPO_SDK.json" package.json
          pnpm install --no-frozen-lockfile
          # [0-9] keeps this glob off the clerk-expo-google-signin tarball.
          SDK_TARBALL="$(ls "$SDK_PACK_DIR"/clerk-expo-[0-9]*.tgz)"
          GOOGLE_SIGNIN_TARBALL="$(ls "$SDK_PACK_DIR"/clerk-expo-google-signin-*.tgz)"
          pnpm add "$SDK_TARBALL" "$GOOGLE_SIGNIN_TARBALL" -w
          # expo-dev-client makes even release builds boot into the dev
          # launcher (unreachable Metro in CI), which stalls every e2e
          # flow on a blank screen. Skip it on e2e jobs only.
          DEV_CLIENT="expo-dev-client"
          if [ "$RUN_E2E" = "true" ]; then DEV_CLIENT=""; fi
          pnpm expo install expo-auth-session expo-constants expo-crypto $DEV_CLIENT expo-secure-store expo-web-browser
          if [ "$RUN_E2E" = "true" ]; then
            REACT_VERSION=$(node -p 'require("react/package.json").version')
            REACT_DOM_VERSION=$(node -p 'require("react-dom/package.json").version')
            if [ "$REACT_VERSION" != "$REACT_DOM_VERSION" ]; then
              echo "::error::React version mismatch: react@$REACT_VERSION, react-dom@$REACT_DOM_VERSION"
              exit 1
            fi
          fi

      - name: Check e2e secret availability
        id: gate
        if: matrix.run-e2e == true
        env:
          KEYS: ${{ secrets.INTEGRATION_STAGING_INSTANCE_KEYS }}
        run: |
          if [ -n "$KEYS" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::INTEGRATION_STAGING_INSTANCE_KEYS unavailable (fork PR?); running build-only."
          fi

      - name: Resolve Clerk instance keys
        id: keys
        if: steps.gate.outputs.ok == 'true'
        continue-on-error: true
        env:
          INTEGRATION_STAGING_INSTANCE_KEYS: ${{ secrets.INTEGRATION_STAGING_INSTANCE_KEYS }}
        run: node scripts/resolve-instance-keys.mjs INTEGRATION_STAGING_INSTANCE_KEYS "$E2E_INSTANCE_NAME"

      - name: Write fixture .env
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.FIXTURE_DIR }}
        env:
          E2E_PK: ${{ steps.keys.outputs.pk }}
        run: |
          echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${E2E_PK:-$FIXTURE_PUBLISHABLE_KEY}" > .env

      - name: Set up JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prebuild Android fixture
        if: matrix.platform == 'android' && steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.FIXTURE_DIR }}
        run: pnpm expo prebuild --clean --platform android

      - name: Build Android fixture
        if: matrix.platform == 'android' && steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.FIXTURE_DIR }}
        run: pnpm build:android

      - name: Prebuild iOS fixture
        if: matrix.platform == 'ios' && steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.FIXTURE_DIR }}
        run: pnpm expo prebuild --clean --platform ios

      - name: Build iOS fixture
        if: matrix.platform == 'ios' && steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.FIXTURE_DIR }}
        run: pnpm build:ios

      - name: Save native build
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.native-build-key.outputs.artifact }}
          key: ${{ steps.native-build-cache.outputs.cache-primary-key }}

      # setup-node above only runs on a native-build cache miss; argent needs
      # Node 20.12+ regardless, so guarantee it on the e2e path.
      - name: Set up Node for argent
        if: steps.keys.outputs.pk != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0

      # ~/.argent holds the proprietary device backends (simulator-server,
      # native devtools) that the first run otherwise downloads.
      - name: Cache argent binaries
        if: steps.keys.outputs.pk != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.argent
          key: argent-${{ runner.os }}-${{ env.ARGENT_VERSION }}

      - name: Install argent CLI
        if: steps.keys.outputs.pk != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g "@swmansion/argent@$ARGENT_VERSION"
          argent telemetry disable || true
          argent --version
          # The linux simulator-server bundled in the npm release predates the
          # headless-linux fixes (it exits at spawn on CI), so pull the build
          # from the release channel argent's own CI pins. Drop once upstream
          # radon#118 ships the fixed binary in the npm package.
          if [ "$RUNNER_OS" = "Linux" ]; then
            gh release download radon-daily \
              --repo software-mansion-labs/simulator-server-releases \
              --pattern simulator-server-argent-linux \
              --output /tmp/simulator-server-argent-linux --clobber
            ARGENT_DIR="$(npm root -g)/@swmansion/argent"
            install -m 0755 /tmp/simulator-server-argent-linux "$ARGENT_DIR/bin/linux/simulator-server"
          fi

      - name: Boot iOS simulator
        id: sim
        if: matrix.platform == 'ios' && steps.keys.outputs.pk != ''
        uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 # v5
        with:
          model: 'iPhone 17 Pro'

      # Provisioned as late as possible so live credentials exist for the
      # shortest window.
      - name: Provision test user via BAPI
        id: user
        if: steps.keys.outputs.pk != ''
        continue-on-error: true
        env:
          CLERK_SECRET_KEY: ${{ steps.keys.outputs.sk }}
        run: |
          email="ci-${GITHUB_RUN_ID}-${RANDOM}+clerk_test@clerkcookie.com"
          username="ci_${GITHUB_RUN_ID}_${RANDOM}"
          password="ClerkCI!$(openssl rand -hex 8)Aa1"
          http_code=$(curl -sS -o /tmp/bapi_response.json -w "%{http_code}" -X POST "$BAPI_URL/v1/users" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email_address\":[\"$email\"],\"username\":\"$username\",\"password\":\"$password\"}")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::BAPI user creation failed (HTTP $http_code)"
            cat /tmp/bapi_response.json
            exit 1
          fi
          user_id=$(jq -er '.id' /tmp/bapi_response.json)
          echo "::add-mask::$password"
          {
            echo "email=$email"
            echo "password=$password"
            echo "user_id=$user_id"
          } >> "$GITHUB_OUTPUT"

      - name: Run iOS e2e (Argent)
        id: run_e2e_ios
        if: matrix.platform == 'ios' && steps.user.outputs.user_id != ''
        working-directory: ${{ env.FIXTURE_DIR }}
        env:
          ARGENT_SECRET_CLERK_TEST_EMAIL: ${{ steps.user.outputs.email }}
          ARGENT_SECRET_CLERK_TEST_PASSWORD: ${{ steps.user.outputs.password }}
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          echo "Using simulator $SIM_UDID"
          # Reboot through argent so it applies its accessibility settings and
          # warms its simulator-server before the first flow.
          argent run boot-device --udid "$SIM_UDID" --force true
          # Kill animations + predictive keyboard: animations add latency to
          # every tap; predictive text hijacks typed text.
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.UIKit UIAnimationDragCoefficient -float 0.01 || true
          xcrun simctl spawn "$SIM_UDID" defaults write -g ApplePersistenceIgnoreState -bool YES || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.ContinuousPath -bool NO || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.AutoCapitalization -bool NO || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.AutoCorrection -bool NO || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.Prediction -bool NO || true
          # Stream the app's console output into the debug artifact so a hang has
          # actionable evidence (keychain/network errors) instead of just screenshots.
          mkdir -p "$RUNNER_TEMP/argent-debug"
          xcrun simctl spawn "$SIM_UDID" log stream --style compact \
            --predicate 'processImagePath CONTAINS "ClerkExpoNativeBuildFixture"' \
            > "$RUNNER_TEMP/argent-debug/sim-console.log" 2>&1 &
          LOG_PID=$!
          APP_PATH="$GITHUB_WORKSPACE/$FIXTURE_DIR/ios/build/Build/Products/Release-iphonesimulator/ClerkExpoNativeBuildFixture.app"
          cd "$GITHUB_WORKSPACE/$E2E_DIR"
          rc=0
          E2E_DEBUG_OUTPUT="$RUNNER_TEMP/argent-debug" ./run-argent-flows.sh ios "$SIM_UDID" "$APP_PATH" || rc=$?
          kill "$LOG_PID" 2>/dev/null || true
          exit "$rc"

      - name: Enable KVM
        if: matrix.platform == 'android' && steps.user.outputs.user_id != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Argent's Android touch backend (simulator-server) only supports
      # emulators argent boots itself: headless qemu with argent's GPU mode
      # under a Wayland compositor. An externally booted emulator (e.g.
      # reactivecircus with swiftshader_indirect) makes every gesture-tap
      # fail with "simulator-server exited before becoming ready", so this
      # mirrors argent's own wayland-e2e.yml recipe instead.
      - name: Prepare Android emulator (Weston + SDK + AVD)
        if: matrix.platform == 'android' && steps.user.outputs.user_id != ''
        env:
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
        run: |
          sudo apt-get update -y
          # libgoogle-perftools ships libtcmalloc_minimal.so.4, which
          # qemu-system-x86_64 links against (t64 naming on ubuntu 24.04+).
          sudo apt-get install -y --no-install-recommends \
            weston xkb-data libxkbcommon0 seatd libgoogle-perftools4t64 \
            || sudo apt-get install -y --no-install-recommends \
              weston xkb-data libxkbcommon0 seatd libgoogle-perftools4
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # weston >=10 takes --backend=headless; ubuntu 22.04 ships weston 9,
          # which wants the plugin filename.
          for backend in headless headless-backend.so; do
            nohup weston --backend="$backend" --socket=wayland-0 --width=1920 --height=1080 \
              >> /tmp/weston.log 2>&1 &
            for i in $(seq 1 15); do
              [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break
              sleep 1
            done
            [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break
          done
          test -S "$XDG_RUNTIME_DIR/wayland-0" || { cat /tmp/weston.log; exit 1; }
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          set -e
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" >/dev/null
          mkdir -p "$HOME/.android"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" -v create avd \
            -n argent-test -k "system-images;android-34;google_apis;x86_64" --force
          {
            echo "hw.ramSize=4096"
            echo "hw.cpu.ncore=4"
          } >> "$HOME/.android/avd/argent-test.avd/config.ini"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Run Android e2e (Argent)
        id: run_e2e_android
        if: matrix.platform == 'android' && steps.user.outputs.user_id != ''
        env:
          ARGENT_SECRET_CLERK_TEST_EMAIL: ${{ steps.user.outputs.email }}
          ARGENT_SECRET_CLERK_TEST_PASSWORD: ${{ steps.user.outputs.password }}
          ARGENT_EMULATOR_NO_WINDOW: '1'
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
          WAYLAND_DISPLAY: wayland-0
          # The emulator's bundled Qt has no wayland plugin; offscreen keeps
          # it from SIGABRTing with WAYLAND_DISPLAY set.
          QT_QPA_PLATFORM: offscreen
        run: |
          argent run boot-device --avdName argent-test
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          cd "$GITHUB_WORKSPACE/$E2E_DIR"
          rc=0
          E2E_DEBUG_OUTPUT="$RUNNER_TEMP/argent-debug" ./run-android-argent-flows.sh \
            "$GITHUB_WORKSPACE/$FIXTURE_DIR/android/app/build/outputs/apk/release/app-release.apk" || rc=$?
          # Argent's own logs say why device backends died; ship them with the artifact.
          cp "$HOME"/.argent/*.log "$RUNNER_TEMP/argent-debug/" 2>/dev/null || true
          exit "$rc"

      # Runs before the artifact upload so the credentials are already dead
      # by the time the debug files become downloadable.
      - name: Cleanup test user
        if: always() && steps.user.outputs.user_id != ''
        env:
          CLERK_SECRET_KEY: ${{ steps.keys.outputs.sk }}
          USER_ID: ${{ steps.user.outputs.user_id }}
        run: |
          curl -fsS -X DELETE "$BAPI_URL/v1/users/$USER_ID" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" || true

      # Argent redacts resolved {{secret:...}} values from its own reports,
      # but the logcat / sim-console captures are ours; scrub them the same
      # way as before. add-mask only covers step logs, not artifact contents.
      - name: Scrub test credentials from Argent debug output
        if: always() && (steps.run_e2e_ios.outcome == 'failure' || steps.run_e2e_android.outcome == 'failure')
        env:
          CLERK_TEST_PASSWORD: ${{ steps.user.outputs.password }}
        run: |
          [ -d "$RUNNER_TEMP/argent-debug" ] || exit 0
          [ -n "$CLERK_TEST_PASSWORD" ] || exit 0
          # shellcheck disable=SC2016
          find "$RUNNER_TEMP/argent-debug" -type f \
            \( -name '*.html' -o -name '*.json' -o -name '*.log' -o -name '*.txt' -o -name '*.xml' -o -name '*.yaml' \) \
            -exec perl -pi -e 's/\Q$ENV{CLERK_TEST_PASSWORD}\E/[REDACTED]/g' {} +

      - name: Upload Argent artifacts on e2e failure
        if: always() && (steps.run_e2e_ios.outcome == 'failure' || steps.run_e2e_android.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: argent-${{ matrix.platform }}
          path: ${{ runner.temp }}/argent-debug
          retention-days: 7

      - name: Report e2e outcome
        if: always() && steps.user.outputs.user_id != ''
        env:
          IOS_OUTCOME: ${{ steps.run_e2e_ios.outcome }}
          ANDROID_OUTCOME: ${{ steps.run_e2e_android.outcome }}
        run: |
          outcome="$IOS_OUTCOME"
          [ "$outcome" = "skipped" ] && outcome="$ANDROID_OUTCOME"
          echo "## Argent e2e (${{ matrix.platform }}): $outcome" >> "$GITHUB_STEP_SUMMARY"
          if [ "$outcome" = "failure" ]; then
            echo "::error::Argent e2e failed. See the argent-${{ matrix.platform }} artifact."
          fi
