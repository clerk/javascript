import groovy.json.JsonSlurper

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jetbrains.kotlin.plugin.compose'
}

group = 'com.clerk.expo'
version = '1.0.0'

def clerkExpoPackageJson = new JsonSlurper().parse(new File(projectDir, '../package.json'))

android {
  namespace 'expo.modules.clerk'
  compileSdk 36
  defaultConfig {
    minSdk 24
    targetSdk 36
    buildConfigField 'String', 'CLERK_EXPO_VERSION', "\"${clerkExpoPackageJson.version}\""
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }
  kotlinOptions { jvmTarget = '17' }
  buildFeatures { buildConfig true; compose true }
  packaging { resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF'] } }
}

dependencies {
  implementation project(':expo-modules-core')
  // This transport requires the generated 2.x public resources on both native SDKs.
  implementation 'com.clerk:clerk-android-api:2.0.0-alpha.0'
  implementation 'com.clerk:clerk-android-ui:2.0.0-alpha.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
  implementation platform('androidx.compose:compose-bom:2026.06.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.activity:activity-compose:1.13.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  testImplementation 'junit:junit:4.13.2'
}
